name: Check upstream stable releases

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch unprocessed stable v1 releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api --paginate 'repos/anomalyco/opencode/releases?per_page=100' --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          tags=$(printf '%s\n' "$releases" | awk -F. '$1 == "v1" && NF == 3 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && ($2 > 18 || ($2 == 18 && $3 >= 33))' | sort -V | tail -n 1)
          if [ -z "$tags" ]; then
            echo 'No stable v1 releases at or above v1.18.33'
          fi
          for upstream_tag in $tags; do
            release_tag="pr-7380-replay-${upstream_tag}"
            release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}"
            if release=$(gh api "$release_url" 2>&1); then
              if [ "$(printf '%s' "$release" | jq -r '.draft == false and .prerelease == true')" != true ]; then
                echo "Release ${release_tag} is not a published prerelease; operator recovery required" >&2
                exit 1
              fi
              assets=$(printf '%s' "$release" | jq -r '[.assets[].name] | sort | join("\n")')
              expected_assets=$(printf '%s\n' opencode-linux-x64.zip opencode-windows-x64.zip SHA256SUMS.txt | sort)
              if [ "$assets" != "$expected_assets" ]; then
                echo "Published release ${release_tag} has unexpected assets; operator recovery required" >&2
                exit 1
              fi
              echo "Verification v1 release for ${upstream_tag} already exists with expected assets"
              continue
            fi
            if ! printf '%s\n' "$release" | grep -Eq 'HTTP/[^ ]+ 404([[:space:]]|$)|\(HTTP 404\)'; then
              echo "Could not determine verification v1 release state for ${upstream_tag}: ${release}" >&2
              exit 1
            fi
            if response=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" 2>&1); then
              echo "Fork tag ${release_tag} exists without a published release; operator recovery required" >&2
              exit 1
            fi
            if ! printf '%s\n' "$response" | grep -Eq 'HTTP/[^ ]+ 404([[:space:]]|$)|\(HTTP 404\)'; then
              echo "Could not determine fork tag state for ${release_tag}: ${response}" >&2
              exit 1
            fi
            gh workflow run build-pr-verification-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              -f upstream_tag="$upstream_tag" \
              -f base_branch=issue/7380 \
              -f patch_branch=session-list-pagination \
              -f prerelease=true
          done

  check-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch unprocessed stable v2 tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(git ls-remote --tags --refs https://github.com/anomalyco/opencode.git \
            | awk '$2 ~ /^refs\/tags\/v2\.[0-9]+\.[0-9]+$/ { sub("refs/tags/", "", $2); split($2, version, "."); if (version[2] > 0 || version[3] >= 21) print $2 }' \
            | sort -V | tail -n 1)
          if [ -z "$tags" ]; then
            echo 'No stable v2 tags at or above v2.0.21'
          fi
          for upstream_tag in $tags; do
            release_tag="v2-pagination-${upstream_tag}-ff8a075d"
            release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}"
            if release=$(gh api "$release_url" 2>&1); then
              if [ "$(printf '%s' "$release" | jq -r '.draft == false and .prerelease == true')" != true ]; then
                echo "Release ${release_tag} is not a published prerelease; operator recovery required" >&2
                exit 1
              fi
              assets=$(printf '%s' "$release" | jq -r '[.assets[].name] | sort | join("\n")')
              expected_assets=$(printf '%s\n' \
                opencode-v2-linux-x64.zip opencode-v2-linux-x64.sha256 opencode-v2-linux-x64.build-info.md \
                opencode-v2-windows-x64.zip opencode-v2-windows-x64.sha256 opencode-v2-windows-x64.build-info.md | sort)
              if [ "$assets" != "$expected_assets" ]; then
                echo "Published release ${release_tag} has unexpected assets; operator recovery required" >&2
                exit 1
              fi
              echo "Verification v2 release for ${upstream_tag} already exists with expected assets"
              continue
            fi
            if ! printf '%s\n' "$release" | grep -Eq 'HTTP/[^ ]+ 404([[:space:]]|$)|\(HTTP 404\)'; then
              echo "Could not determine verification v2 release state for ${upstream_tag}: ${release}" >&2
              exit 1
            fi
            if response=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" 2>&1); then
              echo "Fork tag ${release_tag} exists without a published release; operator recovery required" >&2
              exit 1
            fi
            if ! printf '%s\n' "$response" | grep -Eq 'HTTP/[^ ]+ 404([[:space:]]|$)|\(HTTP 404\)'; then
              echo "Could not determine fork tag state for ${release_tag}: ${response}" >&2
              exit 1
            fi
            gh workflow run build-v2-pagination-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              -f upstream_tag="$upstream_tag"
          done
