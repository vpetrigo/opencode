name: Check upstream stable v1 release

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Find highest stable v1 release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api --paginate 'repos/anomalyco/opencode/releases?per_page=100' --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v1\\.[0-9]+\\.[0-9]+$"))) | .tag_name')
          if [ -z "$releases" ]; then
            echo 'No stable v1 release found' >&2
            exit 1
          fi
          tag=$(printf '%s\n' "$releases" | sort -V | tail -n 1)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Latest stable v1 release: ${tag}"

      - name: Check verification release and dispatch if absent
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="repos/${GITHUB_REPOSITORY}/releases/tags/pr-7380-replay-${UPSTREAM_TAG}"
          if response=$(gh api --include "$release_url" 2>&1); then
            echo "Verification release for ${UPSTREAM_TAG} already exists"
            exit 0
          fi
          if ! printf '%s\n' "$response" | grep -Eq '^HTTP/[^ ]+ 404([[:space:]]|$)'; then
            echo "Could not determine verification release state: ${response}" >&2
            exit 1
          fi
          gh workflow run build-pr-verification-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f upstream_tag="$UPSTREAM_TAG" \
            -f base_branch=issue/7380 \
            -f patch_branch=session-list-pagination \
            -f prerelease=true \
            -f include_v2=false \
            -f v2_branch=prototype-session-list
