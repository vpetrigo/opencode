name: Build V2 pagination verification release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Stable upstream v2 release tag to verify
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: v2-pagination-release-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare replay source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prepared_sha: ${{ steps.prepare.outputs.prepared_sha }}
      prepared_ref: ${{ steps.prepare.outputs.prepared_ref }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      picker_sha: ${{ steps.prepare.outputs.picker_sha }}
      fixture_sha: ${{ steps.prepare.outputs.fixture_sha }}
      v2_version: ${{ steps.prepare.outputs.v2_version }}
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
    steps:
      - name: Checkout automation fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Validate pins and replay patches
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$UPSTREAM_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable v2.X.Y release tag, got: ${UPSTREAM_TAG}" >&2
            exit 1
          fi
          picker_sha=5c106346f7ca678676732822f0a2616e1d3dfab0
          fixture_sha=ff8a075d99ec3b1eb9cf5367d505439c9b2da027
          expected_picker_parent=8a8bd622a3d7dc29ccf30ec17f84e363ed95ed72
          expected_fixture_parent=5c106346f7ca678676732822f0a2616e1d3dfab0
          expected_tip=ff8a075d99ec3b1eb9cf5367d505439c9b2da027

          git fetch origin '+refs/heads/v2-pagination:refs/remotes/origin/v2-pagination'
          git fetch https://github.com/anomalyco/opencode.git "+refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}" '+refs/tags/v2.0.21:refs/tags/v2.0.21'
          upstream_sha=$(git rev-parse "refs/tags/${UPSTREAM_TAG}^{commit}")
          official_sha=$(git rev-parse 'refs/tags/v2.0.21^{commit}')
          patch_tip=$(git rev-parse 'refs/remotes/origin/v2-pagination^{commit}')

          test "$official_sha" = "$expected_picker_parent"
          test "$patch_tip" = "$expected_tip"
          test "$(git rev-parse "${picker_sha}^1")" = "$expected_picker_parent"
          test "$(git rev-parse "${fixture_sha}^1")" = "$expected_fixture_parent"
          test "$(git rev-parse "${patch_tip}^1")" = "$expected_fixture_parent"
          for commit in "$picker_sha" "$fixture_sha" "$patch_tip"; do
            parents=$(git rev-list --parents -n 1 "$commit" | wc -w)
            test "$parents" -eq 2
          done

          git checkout --detach "$upstream_sha"
          git cherry-pick -x "$picker_sha"
          git cherry-pick -x "$fixture_sha"

          prepared_sha=$(git rev-parse HEAD)
          test "$(git rev-list --count "${upstream_sha}..${prepared_sha}")" -eq 2
          test -z "$(git rev-list --merges "${upstream_sha}..${prepared_sha}")"
          test "$(git rev-parse "${prepared_sha}~1")" != "$upstream_sha"

          prepared_ref="verification-v2-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format "refs/heads/${prepared_ref}"
          git push origin "${prepared_sha}:refs/heads/${prepared_ref}"
          short_sha=${prepared_sha:0:7}
          v2_version="${UPSTREAM_TAG#v}-pagination.${short_sha}"

          echo "prepared_sha=${prepared_sha}" >> "$GITHUB_OUTPUT"
          echo "prepared_ref=${prepared_ref}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "picker_sha=${picker_sha}" >> "$GITHUB_OUTPUT"
          echo "fixture_sha=${fixture_sha}" >> "$GITHUB_OUTPUT"
          echo "v2_version=${v2_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      PICKER_SHA: ${{ needs.prepare.outputs.picker_sha }}
      FIXTURE_SHA: ${{ needs.prepare.outputs.fixture_sha }}
      PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
      PREPARED_REF: ${{ needs.prepare.outputs.prepared_ref }}
      V2_VERSION: ${{ needs.prepare.outputs.v2_version }}
    steps:
      - name: Checkout automation fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout prepared v2 source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          path: source-v2
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build v2 pagination artifact
        shell: pwsh
        run: ./.github/scripts/build-v2-pagination-artifact.ps1

      - name: Upload v2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v2-${{ matrix.platform }}
          path: ${{ runner.temp }}/opencode-v2-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish v2 release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [prepare, build]
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      PICKER_SHA: ${{ needs.prepare.outputs.picker_sha }}
      FIXTURE_SHA: ${{ needs.prepare.outputs.fixture_sha }}
      PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
      PREPARED_REF: ${{ needs.prepare.outputs.prepared_ref }}
      V2_VERSION: ${{ needs.prepare.outputs.v2_version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout automation fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout prepared v2 source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          path: source-v2
          persist-credentials: false

      - name: Download v2 artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: opencode-v2-*
          path: ${{ runner.temp }}/opencode-v2-verification-artifacts
          merge-multiple: true

      - name: Publish v2 pagination release
        shell: pwsh
        run: ./.github/scripts/publish-v2-pagination-release.ps1
