name: Build PR verification release

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch to rebase onto
        required: true
        default: issue/7380
        type: string
      patch_branch:
        description: Fork patch branch to rebase and build
        required: true
        default: session-list-pagination
        type: string
      release_name:
        description: Optional release/tag name override
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Rebase patch branch
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Rebase and push patch branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"
          git checkout -B "${PATCH_BRANCH}" "origin/${PATCH_BRANCH}"
          git rebase "origin/${BASE_BRANCH}"
          git push origin "HEAD:${PATCH_BRANCH}" --force-with-lease

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build verification artifact
        shell: pwsh
        run: ./.github/scripts/build-pr-verification-artifact.ps1

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verification artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/opencode-verification-artifacts
          merge-multiple: true

      - name: Publish verification release
        shell: pwsh
        run: ./.github/scripts/publish-pr-verification-release.ps1
