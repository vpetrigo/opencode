name: Build PR verification release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream OpenCode release tag to verify
        required: true
        default: ""
        type: string
      base_branch:
        description: Branch containing issue/7380 fixes to replay
        required: true
        default: issue/7380
        type: string
      patch_branch:
        description: Branch containing session list pagination fixes to replay
        required: true
        default: session-list-pagination
        type: string
      release_name:
        description: Optional release/tag name override
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: true
        type: boolean
      include_v2:
        description: Include the v2 lildax session-list prototype
        required: false
        default: false
        type: boolean
      v2_branch:
        description: Branch containing the v2 prototype commit
        required: true
        default: prototype-session-list
        type: string

permissions:
  contents: read

concurrency:
  group: verification-release-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare source ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.prepare.outputs.source_ref }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      patch_sha: ${{ steps.prepare.outputs.patch_sha }}
      v2_sha: ${{ steps.prepare.outputs.v2_sha }}
      version: ${{ steps.prepare.outputs.version }}
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      INCLUDE_V2: ${{ inputs.include_v2 }}
      V2_BRANCH: ${{ inputs.v2_branch }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare and push source ref
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//; s/-\+/-/g'
          }

          if [[ ! "$UPSTREAM_TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable v1 release tag (v1.X.Y), got: ${UPSTREAM_TAG}" >&2
            exit 1
          fi
          source_ref="verification-source-$(sanitize "$UPSTREAM_TAG")-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format "refs/heads/${BASE_BRANCH}"
          git check-ref-format "refs/heads/${PATCH_BRANCH}"
          git check-ref-format "refs/tags/${UPSTREAM_TAG}"
          if [ "$INCLUDE_V2" = "true" ]; then
            test "$PRERELEASE" = "true"
            git check-ref-format "refs/heads/${V2_BRANCH}"
          fi
          git fetch origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")
          patch_sha=$(git rev-parse "refs/remotes/origin/${PATCH_BRANCH}")
          issue_base=2fa3363c924c5c3e367b84a87ae478296a0ed59b
          expected_base=c5a9fd5cbee2545f725636709e220c1a4c5b0796
          expected_patch=d9477e2beb977d0be6e6993be2f9cd27408d8be1
          approved_upstream=51ef4be1d3c122f18fefb510dca8d778571f4f18
          approved_v2=e609c0dad189294045e1fb6ff315c3516c2c8511
          git fetch https://github.com/anomalyco/opencode.git "+refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          upstream_sha=$(git rev-parse "refs/tags/${UPSTREAM_TAG}^{commit}")

          test "$base_sha" = "$expected_base"
          test "$patch_sha" = "$expected_patch"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "$expected_base"
          test "$(git rev-parse "refs/remotes/origin/${PATCH_BRANCH}")" = "$expected_patch"
          git merge-base --is-ancestor "$issue_base" "refs/remotes/origin/${BASE_BRANCH}"
          git merge-base --is-ancestor "refs/remotes/origin/${BASE_BRANCH}" "refs/remotes/origin/${PATCH_BRANCH}"
          if [ "$UPSTREAM_TAG" = "v1.18.33" ] && [ "$upstream_sha" != "$approved_upstream" ]; then
            echo "v1.18.33 resolved to an unapproved upstream commit: ${upstream_sha}" >&2
            exit 1
          fi
          test "$(git rev-list --count "${issue_base}..refs/remotes/origin/${BASE_BRANCH}")" -eq 14
          test "$(git rev-list --count "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}")" -eq 6

          issue_merges=$(git rev-list --merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}")
          session_merges=$(git rev-list --merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}")
          test -z "$issue_merges"
          test -z "$session_merges"

          issue_commits=$(git rev-list --reverse --no-merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}")
          session_commits=$(git rev-list --reverse --no-merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}")

          echo "Issue replay base: ${issue_base}"
          echo "Issue replay range: ${issue_base}..${base_sha} (14 commits)"
          echo "Session replay range: ${base_sha}..${patch_sha} (6 commits)"
          echo "Issue replay commits:"
          git log --oneline --reverse --no-merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}"
          echo "Session replay commits:"
          git log --oneline --reverse --no-merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}"

          git checkout --detach "$upstream_sha"

          if [ -n "$issue_commits" ]; then
            git cherry-pick $issue_commits
          fi

          if [ -n "$session_commits" ]; then
            git cherry-pick $session_commits
          fi

          v2_sha=""
          if [ "$INCLUDE_V2" = "true" ]; then
            git fetch origin "+refs/heads/${V2_BRANCH}:refs/remotes/origin/${V2_BRANCH}"
            v2_sha=$(git rev-parse "refs/remotes/origin/${V2_BRANCH}")
            if [ "$v2_sha" != "$approved_v2" ]; then
              echo "V2 branch resolved to an unapproved commit: ${v2_sha}" >&2
              exit 1
            fi
          fi

          source_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/${source_ref}"

          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "patch_sha=${patch_sha}" >> "$GITHUB_OUTPUT"
          echo "v2_sha=${v2_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${UPSTREAM_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      INCLUDE_V2: ${{ inputs.include_v2 }}
      V2_SHA: ${{ needs.prepare.outputs.v2_sha }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
      PREPARED_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout prepared v1 source tree
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source-v1
          persist-credentials: false

      - name: Checkout v2 prototype source tree
        if: inputs.include_v2
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.v2_sha }}
          path: source-v2
          persist-credentials: false

      - name: Export build env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${SOURCE_REF}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${PATCH_SHA}" >> "$GITHUB_ENV"
          echo "V1_ROOT=source-v1" >> "$GITHUB_ENV"
          echo "V2_ROOT=source-v2" >> "$GITHUB_ENV"
          echo "INCLUDE_V2=${INCLUDE_V2}" >> "$GITHUB_ENV"
          echo "V2_SHA=${V2_SHA}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${PREPARED_VERSION}-pr.7380.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build verification artifact
        shell: pwsh
        run: ./.github/scripts/build-pr-verification-artifact.ps1

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [prepare, build]
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      INCLUDE_V2: ${{ inputs.include_v2 }}
      V2_SHA: ${{ needs.prepare.outputs.v2_sha }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
      PREPARED_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout prepared v1 source tree
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source-v1
          persist-credentials: false

      - name: Checkout v2 prototype source tree
        if: inputs.include_v2
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.v2_sha }}
          path: source-v2
          persist-credentials: false

      - name: Export publish env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${SOURCE_REF}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${PATCH_SHA}" >> "$GITHUB_ENV"
          echo "V1_ROOT=source-v1" >> "$GITHUB_ENV"
          echo "V2_ROOT=source-v2" >> "$GITHUB_ENV"
          echo "INCLUDE_V2=${INCLUDE_V2}" >> "$GITHUB_ENV"
          echo "V2_SHA=${V2_SHA}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${PREPARED_VERSION}-pr.7380.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Download verification artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/opencode-verification-artifacts
          merge-multiple: true

      - name: Publish verification release
        shell: pwsh
        run: ./.github/scripts/publish-pr-verification-release.ps1
