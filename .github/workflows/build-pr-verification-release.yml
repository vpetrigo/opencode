name: Build PR verification release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream OpenCode release tag to verify
        required: true
        default: ""
        type: string
      base_branch:
        description: Branch containing issue/7380 fixes to replay
        required: true
        default: issue/7380
        type: string
      patch_branch:
        description: Branch containing session list pagination fixes to replay
        required: true
        default: session-list-pagination
        type: string
      release_name:
        description: Optional release/tag name override
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: verification-release-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare source ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.prepare.outputs.source_ref }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      patch_sha: ${{ steps.prepare.outputs.patch_sha }}
      version: ${{ steps.prepare.outputs.version }}
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare and bundle source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//; s/-\+/-/g'
          }

          if [[ ! "$UPSTREAM_TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable v1 release tag (v1.X.Y), got: ${UPSTREAM_TAG}" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/${BASE_BRANCH}"
          git check-ref-format "refs/heads/${PATCH_BRANCH}"
          git check-ref-format "refs/tags/${UPSTREAM_TAG}"
          issue_base=2fa3363c924c5c3e367b84a87ae478296a0ed59b
          base_sha=c5a9fd5cbee2545f725636709e220c1a4c5b0796
          patch_sha=d9477e2beb977d0be6e6993be2f9cd27408d8be1
          approved_upstream=51ef4be1d3c122f18fefb510dca8d778571f4f18
          git fetch origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"
          current_base_sha=$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")
          current_patch_sha=$(git rev-parse "refs/remotes/origin/${PATCH_BRANCH}")
          git fetch origin "$base_sha" "$patch_sha"
          git cat-file -e "${issue_base}^{commit}"
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${patch_sha}^{commit}"
          git fetch https://github.com/anomalyco/opencode.git "+refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          upstream_sha=$(git rev-parse "refs/tags/${UPSTREAM_TAG}^{commit}")

          echo "Requested base branch ${BASE_BRANCH} currently resolves to ${current_base_sha}; replay snapshot is ${base_sha}."
          echo "Requested patch branch ${PATCH_BRANCH} currently resolves to ${current_patch_sha}; replay snapshot is ${patch_sha}."
          if ! git merge-base --is-ancestor "$issue_base" "$base_sha"; then
            echo "Pinned base snapshot ${base_sha} is not descended from issue base ${issue_base}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base_sha" "$patch_sha"; then
            echo "Pinned patch snapshot ${patch_sha} is not descended from pinned base ${base_sha}." >&2
            exit 1
          fi
          if [ "$UPSTREAM_TAG" = "v1.18.33" ] && [ "$upstream_sha" != "$approved_upstream" ]; then
            echo "v1.18.33 resolved to an unapproved upstream commit: ${upstream_sha}" >&2
            exit 1
          fi
          issue_count=$(git rev-list --count "${issue_base}..${base_sha}")
          if [ "$issue_count" -ne 14 ]; then
            echo "Expected 14 pinned issue commits, found ${issue_count}." >&2
            exit 1
          fi
          session_count=$(git rev-list --count "${base_sha}..${patch_sha}")
          if [ "$session_count" -ne 6 ]; then
            echo "Expected 6 pinned session commits, found ${session_count}." >&2
            exit 1
          fi

          issue_merges=$(git rev-list --merges "${issue_base}..${base_sha}")
          if [ -n "$issue_merges" ]; then
            echo "Pinned issue replay range contains merge commits: ${issue_merges}" >&2
            exit 1
          fi
          session_merges=$(git rev-list --merges "${base_sha}..${patch_sha}")
          if [ -n "$session_merges" ]; then
            echo "Pinned session replay range contains merge commits: ${session_merges}" >&2
            exit 1
          fi

          issue_commits=$(git rev-list --reverse --no-merges "${issue_base}..${base_sha}")
          session_commits=$(git rev-list --reverse --no-merges "${base_sha}..${patch_sha}")

          echo "Issue replay base: ${issue_base}"
          echo "Issue replay range: ${issue_base}..${base_sha} (14 commits)"
          echo "Session replay range: ${base_sha}..${patch_sha} (6 commits)"
          echo "Issue replay commits:"
          git log --oneline --reverse --no-merges "${issue_base}..${base_sha}"
          echo "Session replay commits:"
          git log --oneline --reverse --no-merges "${base_sha}..${patch_sha}"

          git checkout --detach "$upstream_sha"

          if [ -n "$issue_commits" ]; then
            git cherry-pick -x $issue_commits
          fi

          if [ -n "$session_commits" ]; then
            git cherry-pick -x $session_commits
          fi

          source_sha=$(git rev-parse HEAD)
          replay_count=$(git rev-list --count "${upstream_sha}..${source_sha}")
          if [ "$replay_count" -ne 20 ]; then
            echo "Expected 20 replayed commits after upstream, found ${replay_count}." >&2
            exit 1
          fi
          replay_merges=$(git rev-list --merges "${upstream_sha}..${source_sha}")
          if [ -n "$replay_merges" ]; then
            echo "Prepared replay range contains merge commits: ${replay_merges}" >&2
            exit 1
          fi
          source_ref="verification-source-$(sanitize "$UPSTREAM_TAG")-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_bundle="$RUNNER_TEMP/prepared-v1.bundle"
          git check-ref-format "refs/heads/${source_ref}"
          git update-ref "refs/heads/${source_ref}" "$source_sha"
          git bundle create "$source_bundle" "refs/heads/${source_ref}"
          git bundle verify "$source_bundle"

          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "patch_sha=${patch_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${UPSTREAM_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload prepared v1 source bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.source_ref }}
          path: ${{ runner.temp }}/prepared-v1.bundle
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
      PREPARED_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared v1 source bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_ref }}
          path: ${{ runner.temp }}/opencode-v1-source

      - name: Import and verify prepared v1 source
        shell: bash
        env:
          SOURCE_BUNDLE: ${{ runner.temp }}/opencode-v1-source/prepared-v1.bundle
        run: |
          set -euo pipefail
          git init source-v1
          git -C source-v1 bundle verify "$SOURCE_BUNDLE"
          git -C source-v1 bundle list-heads "$SOURCE_BUNDLE" | awk -v ref="refs/heads/${SOURCE_REF}" -v sha="$SOURCE_SHA" '$1 == sha && $2 == ref { found = 1 } END { exit !found }'
          git -C source-v1 fetch --no-tags "$SOURCE_BUNDLE" "refs/heads/${SOURCE_REF}:refs/heads/${SOURCE_REF}"
          git -C source-v1 checkout --detach "$SOURCE_SHA"
          test "$(git -C source-v1 rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Export build env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${SOURCE_REF}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${PATCH_SHA}" >> "$GITHUB_ENV"
          echo "V1_ROOT=source-v1" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${PREPARED_VERSION}-pr.7380.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build verification artifact
        shell: pwsh
        run: ./.github/scripts/build-pr-verification-artifact.ps1

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [prepare, build]
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
      PREPARED_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download prepared v1 source bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_ref }}
          path: ${{ runner.temp }}/opencode-v1-source

      - name: Import and verify prepared v1 source
        shell: bash
        env:
          SOURCE_BUNDLE: ${{ runner.temp }}/opencode-v1-source/prepared-v1.bundle
        run: |
          set -euo pipefail
          git init source-v1
          git -C source-v1 bundle verify "$SOURCE_BUNDLE"
          git -C source-v1 bundle list-heads "$SOURCE_BUNDLE" | awk -v ref="refs/heads/${SOURCE_REF}" -v sha="$SOURCE_SHA" '$1 == sha && $2 == ref { found = 1 } END { exit !found }'
          git -C source-v1 fetch --no-tags "$SOURCE_BUNDLE" "refs/heads/${SOURCE_REF}:refs/heads/${SOURCE_REF}"
          git -C source-v1 checkout --detach "$SOURCE_SHA"
          test "$(git -C source-v1 rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Export publish env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${SOURCE_REF}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${PATCH_SHA}" >> "$GITHUB_ENV"
          echo "V1_ROOT=source-v1" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${PREPARED_VERSION}-pr.7380.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Download verification artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/opencode-verification-artifacts
          merge-multiple: true

      - name: Publish verification release
        shell: pwsh
        run: ./.github/scripts/publish-pr-verification-release.ps1
