name: Build PR verification release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream OpenCode release tag to verify
        required: true
        default: ""
        type: string
      base_branch:
        description: Branch containing issue/7380 fixes to replay
        required: true
        default: issue/7380
        type: string
      patch_branch:
        description: Branch containing session list pagination fixes to replay
        required: true
        default: session-list-pagination
        type: string
      release_name:
        description: Optional release/tag name override
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: verification-release-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare source ref
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.prepare.outputs.source_ref }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      patch_sha: ${{ steps.prepare.outputs.patch_sha }}
      version: ${{ steps.prepare.outputs.version }}
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare and push source ref
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//; s/-\+/-/g'
          }

          source_ref="verification-source-$(sanitize "$UPSTREAM_TAG")"
          test -n "$UPSTREAM_TAG"
          git fetch origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")
          patch_sha=$(git rev-parse "refs/remotes/origin/${PATCH_BRANCH}")
          git fetch https://github.com/anomalyco/opencode.git "+refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}" "+refs/heads/dev:refs/remotes/upstream/dev"

          git merge-base --is-ancestor "refs/remotes/origin/${BASE_BRANCH}" "refs/remotes/origin/${PATCH_BRANCH}"

          issue_base=$(git merge-base "refs/remotes/upstream/dev" "refs/remotes/origin/${BASE_BRANCH}")
          issue_merges=$(git rev-list --merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}")
          session_merges=$(git rev-list --merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}")
          test -z "$issue_merges"
          test -z "$session_merges"

          issue_commits=$(git rev-list --reverse --no-merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}")
          session_commits=$(git rev-list --reverse --no-merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}")

          echo "Issue replay base: ${issue_base}"
          echo "Issue replay commits:"
          git log --oneline --reverse --no-merges "${issue_base}..refs/remotes/origin/${BASE_BRANCH}"
          echo "Session replay commits:"
          git log --oneline --reverse --no-merges "refs/remotes/origin/${BASE_BRANCH}..refs/remotes/origin/${PATCH_BRANCH}"

          git checkout --detach "$UPSTREAM_TAG"

          if [ -n "$issue_commits" ]; then
            git cherry-pick -X theirs $issue_commits
          fi

          if [ -n "$session_commits" ]; then
            git cherry-pick -X theirs $session_commits
          fi

          source_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/${source_ref}" --force

          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "patch_sha=${patch_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${UPSTREAM_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Export build env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${{ needs.prepare.outputs.source_ref }}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${{ needs.prepare.outputs.base_sha }}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${{ needs.prepare.outputs.patch_sha }}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${{ needs.prepare.outputs.version }}-pr.7380.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Build verification artifact
        shell: pwsh
        run: ./.github/scripts/build-pr-verification-artifact.ps1

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Export publish env
        shell: bash
        run: |
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${{ needs.prepare.outputs.source_ref }}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${{ needs.prepare.outputs.base_sha }}" >> "$GITHUB_ENV"
          echo "PATCH_SHA=${{ needs.prepare.outputs.patch_sha }}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${{ needs.prepare.outputs.version }}-pr.7380.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Download verification artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/opencode-verification-artifacts
          merge-multiple: true

      - name: Publish verification release
        shell: pwsh
        run: ./.github/scripts/publish-pr-verification-release.ps1
