name: Build PR verification release

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official upstream ref like vX.Y.Z or dev
        required: true
        default: dev
        type: string
      patch_branch:
        description: Fork patch branch to merge
        required: true
        default: issue/7380
        type: string
      release_name:
        description: Optional release/tag name override
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/anomalyco/opencode.git
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build verification artifact
        shell: pwsh
        run: ./.github/scripts/build-pr-verification-artifact.ps1

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-verification-release/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    env:
      UPSTREAM_REPO: https://github.com/anomalyco/opencode.git
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verification artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/opencode-verification-artifacts
          merge-multiple: true

      - name: Publish verification release
        shell: pwsh
        run: ./.github/scripts/publish-pr-verification-release.ps1
